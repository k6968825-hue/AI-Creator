name: Build AI Creator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/AI_Creator_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-APK
          path: extracted/AI_Creator_Android/app/build/outputs/apk/debug/app-debug.apk
